services:
  storeops-api:
    build: .
    image: storeops-api:local
    ports:
      - "8080:8080"
    environment:
      STOREOPS_BOOTSTRAP_TOKEN: ${STOREOPS_BOOTSTRAP_TOKEN:?Set an opaque demo token}
      STOREOPS_BOOTSTRAP_USER_ID: ${STOREOPS_BOOTSTRAP_USER_ID:?Set a demo user ID}
      STOREOPS_BOOTSTRAP_EMAIL: ${STOREOPS_BOOTSTRAP_EMAIL:?Set a demo email}
      STOREOPS_BOOTSTRAP_NAME: ${STOREOPS_BOOTSTRAP_NAME:?Set a demo name}
      STOREOPS_BOOTSTRAP_ROLE: ${STOREOPS_BOOTSTRAP_ROLE:?Set a StaffRole}
      STOREOPS_BOOTSTRAP_STORE_ID: ${STOREOPS_BOOTSTRAP_STORE_ID:?Set a store ID}
      STOREOPS_BOOTSTRAP_REGION_ID: ${STOREOPS_BOOTSTRAP_REGION_ID:?Set a region ID}
      STOREOPS_BOOTSTRAP_TOKEN_TTL_SECONDS: ${STOREOPS_BOOTSTRAP_TOKEN_TTL_SECONDS:-28800}
      STOREOPS_BOOTSTRAP_INCOMING_LEAD_TOKEN: ${STOREOPS_BOOTSTRAP_INCOMING_LEAD_TOKEN:?Set an incoming lead token}
      STOREOPS_BOOTSTRAP_INCOMING_LEAD_USER_ID: ${STOREOPS_BOOTSTRAP_INCOMING_LEAD_USER_ID:?Set an incoming lead user ID}
      STOREOPS_BOOTSTRAP_INCOMING_LEAD_EMAIL: ${STOREOPS_BOOTSTRAP_INCOMING_LEAD_EMAIL:?Set an incoming lead email}
      STOREOPS_BOOTSTRAP_INCOMING_LEAD_NAME: ${STOREOPS_BOOTSTRAP_INCOMING_LEAD_NAME:?Set an incoming lead name}
